components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    TicketCodeList:
      title: Ticket Code List
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: 'Ticket codes on the current page.'
          items:
            $ref: '#/components/schemas/TicketCode'
        pagination:
          $ref: '#/components/schemas/TicketCodePagination'
    TicketCodePagination:
      title: Ticket Code Pagination
      type: object
      description: 'Pagination details for the ticket codes returned in `data`.'
      required:
        - total
        - offset
        - limit
      properties:
        total:
          type: integer
          description: 'Total number of ticket codes matching the request across all pages.'
          example: 150
        offset:
          type: integer
          description: 'Zero-based index of the first item on the current page.'
          example: 10
        limit:
          type: integer
          description: 'Maximum number of items returned per page.'
          example: 10
        next:
          type: string
          description: 'Relative URL of the next page. Omitted from the response when the current page is the last page.'
          example: '/support/v2/tickets/codes?limit=10&offset=20'
        previous:
          type: string
          description: 'Relative URL of the previous page. Omitted from the response when the current page is the first page.'
          example: '/support/v2/tickets/codes?limit=10&offset=0'
    TicketCode:
      title: Ticket Code
      type: object
      properties:
        code:
          type: string
          description: 'Unique ticket code identifier (e.g. "0301-0000").'
          example: '0301-0000'
        classification:
          type: string
          nullable: true
          description: 'Hierarchical classification in the format `<Category>-<Sub-Category>-<Issue Type>`.'
          example: 'COLOCATION_IBX_DATA_CENTERS-IBX_SUPPORT-IBX_FACILITY_INQUIRY'
        description:
          type: string
          nullable: true
          description: 'Human-readable description of the support ticket type.'
          example: 'Submit a general inquiry or support request related to the physical Equinix IBX data center facility and operations.'
        status:
          type: string
          nullable: true
          enum:
            - active
            - deprecated
          description: 'Lifecycle status of the ticket code.'
          example: 'active'
        deprecation:
          $ref: '#/components/schemas/TicketCodeDeprecation'
    TicketCodeDeprecation:
      title: Ticket Code Deprecation Info
      type: object
      nullable: true
      description: 'Present when `status` is `deprecated`; null otherwise.'
      properties:
        sunsetAt:
          type: string
          format: date-time
          description: 'ISO 8601 date-time after which this code will no longer be accepted.'
          example: '2027-04-07T00:00:00Z'
        successor:
          type: string
          nullable: true
          description: 'Replacement ticket code, or null if no direct successor exists.'
          example: '0102-0700'
    Case:
      title: Create Case Request Payload
      required:
        - code
        - description
      type: object
      properties:
        code:
          type: string
          description: 'Ticket code. See GET /support/v2/tickets/codes for the list of valid ticket codes, and GET /support/v2/tickets/codes/{code}/schema for the required fields for a given ticket code.'
          example: '0200-0000'
        description:
          minLength: 1
          maxLength: 4000
          type: string
          description: 'Description of the issue.'
          example: 'The device is overheating and causing performance issues.'
        primaryId:
          type: string
          description: 'Primary reference identifier.'
          minLength: 1
          maxLength: 100
          example: 'c4d53b61-d408-41aa-a93f-24cb0bb311d9'
        secondaryId:
          type: string
          description: 'Secondary reference identifier.'
          minLength: 1
          maxLength: 100
          example: 'CH1'
        occurredDateTime:
          type: string
          format: date-time
          example: '2020-05-22T19:23:51Z'
          description: 'Date and time the issue occurred.'
        customerReferenceId:
          type: string
          minLength: 1
          maxLength: 200
          description: 'Customer or external reference number.'
          example: 'CustomerReference001'
        attachments:
          type: array
          minItems: 0
          maxItems: 5
          description: 'Supporting files to attach in the case, such as a picture of a broken device.'
          items:
            $ref: '#/components/schemas/Attachment'
        contacts:
          type: array
          description: 'List of persons who will be contacted for this case.'
          items:
            oneOf:
              - $ref: '#/components/schemas/ContactRequestRegisteredUser'
              - $ref: '#/components/schemas/ContactRequestNonRegisteredUser'
        details:
          type: object
          description: 'Additional details or requirements for case resolution. The shape depends on the ticket code — see GET /support/v2/tickets/codes/{code}/schema for the fields applicable to a given code.'
      description: 'A case is a record of an issue in the system.'
    ContactRequestRegisteredUser:
      required:
        - registeredUsers
        - type
      type: object
      properties:
        registeredUsers:
          type: array
          maxItems: 10
          description: 'Usernames of the registered users. A username may or may not be an email address.'
          items:
            type: string
            example: john_doe
        type:
          $ref: '#/components/schemas/TypeOfTheContact'
      description: 'Contact information of a registered user. Ensure that the user status of this contact is approved, active or locked.'
    ContactRequestNonRegisteredUser:
      required:
        - details
        - type
      type: object
      properties:
        firstName:
          $ref: '#/components/schemas/FirstNameOfTheContact'
        lastName:
          $ref: '#/components/schemas/LastNameOfTheContact'
        type:
          $ref: '#/components/schemas/TypeOfTheContact'
        details:
          type: array
          minItems: 2
          maxItems: 3
          description: 'Reference of the related party, could be a party reference or a party role reference.'
          items:
            $ref: '#/components/schemas/ContactsRequestDetails'
      description: 'Contact information of a non-registered contact, including contact details.'
    ContactsRequestDetails:
      required:
        - type
        - value
      type: object
      properties:
        type:
          type: string
          description: 'Communication type.'
          example: PHONE
          enum:
            - EMAIL
            - MOBILE
            - PHONE
        value:
          type: string
          description: 'Unique identifier of related type.'
          example: +1-4601231122
      description: 'Contact details.'
    TypeOfTheContact:
      type: string
      example: 'NOTIFICATION'
      description: 'Role of the contact on the case: NOTIFICATION for updates regarding the case, ORDERING for order-related communication, or TECHNICAL for technical coordination.'
      enum:
        - NOTIFICATION
        - ORDERING
        - TECHNICAL
    FirstNameOfTheContact:
      type: string
      example: 'John'
      description: 'Given name of the person Equinix should contact regarding the case.'
    LastNameOfTheContact:
      type: string
      example: 'Don'
      description: 'Last name of the person Equinix should contact regarding the case.'
    Attachment:
      type: object
      description: 'Attachment refers to extensions or additional parts that is or may be attached to something (agreements, contracts, appointments) to perform a particular function. They can be communication attachments, documents and other.'
      properties:
        id:
          type: string
          minLength: 36
          maxLength: 36
          example: 'c77c5f58-a7ea-4e88-9fc4-1a2900027425'
          description: 'UUID of the uploaded attachment. Use the attachmentId returned by the Attachment API.'
        name:
          type: string
          minLength: 5
          maxLength: 100
          example: 'error-log.txt'
          description: 'File name of the uploaded attachment, including the extension. Use the attachmentName returned by the Attachment API.'
        source:
          type: string
          enum:
            - 'CUSTOMER'
            - 'EQUINIX'
          example: 'CUSTOMER'
          description: 'Source of the attachment: CUSTOMER if provided by the customer, or EQUINIX if added by Equinix.'
    Attachments:
      type: array
      minItems: 0
      maxItems: 5
      description: 'File(s) attached to the case. e.g. picture of broken device, scanning of a bill or charge, etc...'
      items:
        $ref: '#/components/schemas/Attachment'
    Emails:
      type: array
      minItems: 0
      description: 'Email conversation(s) attached to the case. e.g. email conversation with a technician, email conversation with a customer, etc...'
      items:
        $ref: '#/components/schemas/Email'
    Email:
      type: object
      description: 'Email conversation attached to the case. e.g. email conversation with a technician, email conversation with a customer, etc...'
      properties:
        id:
          type: string
          example: '02s7z00000D30lZAAR'
          description: 'Identifier of the email.'
        createdDateTime:
          type: string
          format: date-time
          example: '2023-08-29T04:01:43.000Z'
          description: 'Date and time the email was created.'
        subject:
          type: string
          example: 'Issue with device'
          description: 'Subject of the email.'
        authorName:
          type: string
          example: 'Ali bin Carud'
          description: 'Name of the email author.'
        fromAddress:
          type: string
          example: 'abc@equinix.com'
          description: 'Email address of the email author.'
        toAddress:
          type: string
          example: 'xyz@example.com'
          description: 'Email address of the email recipient.'
    TicketResponse:
      title: Create Case Request Response
      required:
        - id
        - type
      type: object
      properties:
        id:
          $ref: '#/components/schemas/CaseOrOrderNumber'
        type:
          type: string
          example: 'CASE'
          description: 'Support Ticket type.'
          enum:
            - 'CASE'
            - 'TROUBLE'
    AccountName:
      type: string
      example: 'VjT Existing Reseller New BA'
      description: 'User account name.'
    AccountNumber:
      maxLength: 100
      minLength: 6
      type: string
      example: '182389736'
      description: 'User account number.'
    OrderNumber:
      maxLength: 100
      minLength: 14
      type: string
      description: 'Unique identifier assigned to an order, used to retrieve or reference the case associated with it.'
      example: '1-204976070710'
    CaseOrOrderNumber:
      type: string
      minLength: 8
      maxLength: 100
      example: '11150929'
      description: 'Unique identifier used to retrieve a case, provided as either the case number or the order number.'
    StatusResponse:
      type: string
      example: 'IN_PROGRESS'
      description: 'Case status.'
      enum:
        - SUBMITTED
        - IN_PROGRESS
        - RESOLVED
        - ACTION_REQUIRED
        - CLOSED
        - CANCELLED
    ContactResponse:
      type: object
      properties:
        firstName:
          $ref: '#/components/schemas/FirstNameOfTheContact'
        lastName:
          $ref: '#/components/schemas/LastNameOfTheContact'
        type:
          $ref: '#/components/schemas/TypeOfTheContact'
        details:
          description: 'Contact details of the person, such as email, mobile or phone.'
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                example: 'EMAIL'
                description: 'Communication type.'
                enum:
                  - EMAIL
                  - MOBILE
                  - PHONE
              value:
                type: string
                example: 'SomeContact@email.com'
                description: 'Corresponding value according to the Communication Type.'
    SingleCaseResponseV2:
      title: Get a Case by Case or Order Number Response
      type: object
      properties:
        id:
          $ref: '#/components/schemas/CaseOrOrderNumber'
        accountNumber:
          $ref: '#/components/schemas/AccountNumber'
        accountName:
          $ref: '#/components/schemas/AccountName'
        customerReferenceId:
          type: string
          example: 'EESkFTupLmnF6KinbARfNgWAC2V1BZbDZKluF5TI5YVTXTfGkF'
          description: 'Additional information for customer to reference.'
        channel:
          type: string
          example: 'PORTAL'
          enum:
            - OFFLINE
            - PORTAL
          description: 'Channel through which the case was created.'
        orderId:
          $ref: '#/components/schemas/OrderNumber'
        location:
          description: 'Location details of the case.'
          type: object
          properties:
            ibx:
              type: array
              items:
                type: string
                description: 'IBX'
                example: 'SV5'
              description: 'IBX location(s).'
        status:
          $ref: '#/components/schemas/StatusResponse'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactResponse'
          description: 'List of individuals associated with the case who are contacted regarding it.'
        notes:
          description: 'Notes added to the case.'
          type: array
          items:
            type: object
            properties:
              id:
                description: 'Identifier of the note.'
                type: string
                example: 'ID of the note'
              createdDateTime:
                $ref: '#/components/schemas/Datetime'

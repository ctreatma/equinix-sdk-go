          maxLength: 4000
          minLength: 1
          type: string
          description: 'Enter any modification details/additional notes to the technician.'
          example: 'This is a notes!'
        attachments:
          $ref: '#/components/schemas/Attachments'
    ModifyTicketResponse:
      title: Modify Support Ticket Request Response
      type: object
      properties:
        ticketId:
          $ref: '#/components/schemas/CaseOrOrderNumber'
        success:
          type: boolean
          example: true
          description: 'Indicates whether the modification or reply was successful.'
    CancelCase:
      title: Cancel Case Request Payload
      required:
        - reason
      type: object
      properties:
        reason:
          maxLength: 4000
          minLength: 1
          type: string
          description: 'Enter any cancellation details.'
          example: 'This is a reason!'
    CancelCaseResponse:
      title: Cancel Case Request Response
      required:
        - status
      type: object
      properties:
        status:
          type: string
          example: 'OK'
          description: 'Status of the cancellation request.'
          enum:
            - OK
    Datetime:
      type: string
      example: '2023-08-29T04:01:43.000Z'
      format: date-time
      description: 'A datetime string with format YYYY-MM-DDTHH:mm:ss.sssZ.'
    Error:
      type: array
      items:
        required:
          - errorCode
          - errorMessage
        type: object
        properties:
          errorCode:
            type: string
            example: EQ-2017011
            description: Error Code
          errorMessage:
            type: string
            example: Error message
            description: Error Message
          details:
            type: string
            example: Error details
            description: Error Details
          correlationId:
            type: string
            example: 98f3f6fb1e127b1
            description: Correlation ID to trace the error back
          help:
            type: string
            example: URL to a help page for the corresponding errorCode
            description: URL to a help page for the corresponding errorCode
          additionalInfo:
            type: array
            items:
              $ref: '#/components/schemas/ErrorAdditionalInfo'
            description: Additional information about the error
    UnauthorizedError:
      type: array
      items:
        required:
          - errorCode
          - errorMessage
        type: object
        properties:
          correlationId:
            type: string
            example: 98f3f6fb1e127b1
            description: Correlation ID to trace the error back
          errorMessage:
            type: string
            example: 'Not authorized to execute this service'
            description: Error Message
          errorCode:
            type: string
            example: EQ-1610011
            description: Error Code
          details:
            type: string
            example: Error details
            description: Error Details
          help:
            type: string
            example: URL to a help page for the corresponding errorCode
            description: URL to a help page for the corresponding errorCode
          additionalInfo:
            type: array
            items:
              $ref: '#/components/schemas/ErrorAdditionalInfo'
            description: Additional information about the error
    ErrorAdditionalInfo:
      required:
        - property
        - reason
      type: object
      properties:
        property:
          type: string
          example: primaryId
          description: The property that caused the error
        reason:
          type: string
          example: primaryId is mandatory
          description: The reason why the property caused the error
    FieldDefinition:
      type: object
      description: >
        Defines the expected structure, data type, and validation rules for a field
        in the request payload associated with a ticket code. Field definitions can
        be nested recursively to describe fields within objects and elements within
        arrays. The applicable fields and validation rules may vary by ticket code.
      required:
        - dataType
        - fieldDescription
        - required
      properties:
        dataType:
          type: string
          description: 'Data type of the field in the request payload.'
          example: string
          enum:
            - string
            - boolean
            - array
            - object
        fieldDescription:
          type: string
          description: 'Explains the expected input for the field.'
          example: Description of the expected input for the field
        required:
          type: boolean
          description: 'Indicates whether this field is required in the request payload.'
          example: true
        format:
          type: string
          description: 'Specifies the expected format or validation rule for the field.'
          example: date-time
        minLength:
          type: integer
          description: 'Minimum number of characters allowed for a string field.'
          example: 1
        maxLength:
          type: integer
          description: 'Maximum number of characters allowed for a string field.'
          example: 40
        allowedValues:
          type: array
          description: 'List of values accepted for the field, when the field is restricted to a predefined set of values.'
          items:
            type: string
          example:
            - TECHNICAL
            - NOTIFICATION
        constraints:
          type: object
          description: 'Additional validation rules for the field. The applicable constraints depend on the field and may include rules such as minItems, maxItems, maxItemsBy, oneOf, or contains.'
          additionalProperties: true
          example:
            maxItems: 5
        items:
          $ref: '#/components/schemas/FieldDefinition'
        fields:
          type: object
          description: 'Defines the nested fields of an object. Each property name represents a field in the object and its value contains the corresponding field definition.'
          additionalProperties:
            $ref: '#/components/schemas/FieldDefinition'
    RequestSchemaResponse:
      type: object
      description: >
        The resolved request payload schema for one ticket code. `schema` is a map of
        field name to FieldDefinition; `example` is one full sample request body matching
        that schema. Both the set of fields and their sample values vary by ticket code —
        this structure is generic across all codes, but its content is not.
      required:
        - code
        - schema
        - example
      properties:
        code:
          type: string
          description: 'Ticket code, e.g. "0000-0000".'
          example: '0000-0000'
        schema:
          type: object
          description: 'Provides the request payload schema for the ticket code, including available fields, required flags, and any applicable constraints. The fields and their requirements vary by ticket code. The returned value is the source of truth.'
          additionalProperties:
            $ref: '#/components/schemas/FieldDefinition'
        example:
          type: object
          description: 'Illustrative sample request payload for the ticket code. The fields and values vary by ticket code and are provided as a guide only.'
          additionalProperties: true
    CaseNumber:
      maxLength: 8
      minLength: 8
      type: string
      description: 'Case number.'
      example: '11150929'
    ModifyCaseResponse:
      title: Modify Case Request Response
      required:
        - result
      type: object
      properties:
        result:
          type: object
          description: 'Result of the modification request.'

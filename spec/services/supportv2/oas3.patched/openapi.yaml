                type: string
                description: 'The type of the note.'
                enum:
                  - RESOLUTION_NOTES
                  - CUSTOMER_NOTES
                example: 'RESOLUTION_NOTES'
        attachments:
          $ref: '#/components/schemas/Attachments'
        email:
          $ref: '#/components/schemas/Emails'
        createdDateTime:
          $ref: '#/components/schemas/Datetime'
        otherDetails:
          description: 'Additional details of the case, such as category, status history and product line items.'
          type: object
          properties:
            contactUCMID:
              description: 'Identifier of the case contact.'
              type: string
              example: '236284'
            recordType:
              description: 'Channel through which the case was created.'
              type: string
              example: 'ECM'
              enum:
                - ECM
                - GSD Case
            subChannel:
              description: 'Sub-channel through which the case was created.'
              type: string
              example: 'ECP'
              enum:
                - ECP
            finalScheduledDate:
              $ref: '#/components/schemas/Datetime'
            category:
              description: 'Category of the case.'
              type: string
              example: 'Trouble Services'
            subCategory:
              description: 'Sub-category of the case.'
              type: string
              example: 'Incident'
            description:
              description: 'Description of the case.'
              type: string
              example: 'Sample description.'
            updatedDateTime:
              $ref: '#/components/schemas/Datetime'
            updatedByFullName:
              description: 'Identifier of the user who last updated the case.'
              type: string
              example: '0052H000003iLJjQAM'
            requestedTerminationDate:
              description: 'Date on which termination of the service is requested.'
              type: string
              example: '2026-09-01'
              format: date
            statusHistory:
              description: 'History of the status changes of the case.'
              type: array
              items:
                type: object
                properties:
                  status:
                    $ref: '#/components/schemas/StatusResponse'
                  createdDate:
                    $ref: '#/components/schemas/Datetime'
            purchaseOrders:
              description: 'Purchase order numbers associated with the case.'
              type: array
              items:
                type: string
                example: 'PO.1234'
            products:
              description: 'Products associated with the case.'
              type: array
              items:
                type: string
                example: 'SMART_HANDS'
            productOfferingCodes:
              description: 'Product offering codes associated with the case.'
              type: array
              items:
                type: string
                example: 'PS00001.PROD'
            details:
              description: 'Line items of the case, one per product requested.'
              type: array
              items:
                type: object
                properties:
                  lineId:
                    description: 'Identifier of the line item.'
                    type: string
                    example: '1-2RCPXBUV'
                  parentLineId:
                    description: 'Identifier of the parent line item.'
                    type: string
                    example: '1-2RCPXBUK'
                  productType:
                    description: 'Type of the product requested.'
                    type: string
                    example: 'SMART_HANDS'
                    enum:
                      - SMART_HANDS
                  productOfferingCode:
                    description: 'Code of the product offering requested.'
                    type: string
                    example: 'PS00001.PROD'
                  productCode:
                    description: 'Code of the product requested.'
                    type: string
                    example: 'PS00040.ELEM'
                  productName:
                    description: 'Name of the product requested.'
                    type: string
                    example: 'Other'
                  status:
                    description: 'Status of the line item.'
                    type: string
                    example: 'SUBMITTED'
                    enum:
                      - IN_PROGRESS
                      - CANCELLED
                      - SUBMITTED
                      - CLOSED
                      - ACTION_REQUIRED
                      - RESOLVED
                  reOpen:
                    description: 'Indicates whether the line item can be reopened.'
                    type: string
                    example: 'NOT_ALLOWED'
                  respond:
                    description: 'Indicates whether a response can be added to the line item.'
                    type: boolean
                    example: true
                  ibx:
                    description: 'IBX data center of the line item.'
                    type: string
                    example: 'DA3'
                  cage:
                    description: 'Cage of the line item.'
                    type: string
                    example: 'DA3:01:010315'
                  requestType:
                    description: 'Type of request made for the line item.'
                    type: string
                    example: 'ADD'
                    enum:
                      - ADD
                  activityId:
                    description: 'Identifier of the activity associated with the line item.'
                    type: string
                    example: '3-216270588333'
                  purchaseOrder:
                    description: 'Purchase order associated with the line item.'
                    type: object
                    example: {}
                  estimatedCompletion:
                    description: 'Estimated completion details of the line item.'
                    type: object
                    properties:
                      originalDateTime:
                        description: 'Originally estimated date and time of completion.'
                        type: string
                        example: '2023-08-29T04:01:43.000Z'
                        format: date-time
                  updatedDateTime:
                    description: 'Date and time the line item was last updated.'
                    type: string
                    example: '2023-08-29T04:01:43.000Z'
                    format: date-time
                  additionalInfo:
                    description: 'Additional information about the line item as key-value pairs.'
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          description: 'Name of the additional information entry.'
                          type: string
                          example: 'IS_RECURRING'
                        value:
                          description: 'Value of the additional information entry.'
                          type: boolean
                          example: true
                  modifiable:
                    description: 'Indicates whether the line item can be modified.'
                    type: boolean
                    example: false
                  cancellable:
                    description: 'Indicates whether the line item can be cancelled.'
                    type: boolean
                    example: true
            additionalInfo:
              description: 'Additional information about the case as key-value pairs.'
              type: array
              items:
                type: object
                properties:
                  key:
                    description: 'Name of the additional information entry.'
                    type: string
                    example: 'RECURRING_TYPE'
                  value:
                    description: 'Value of the additional information entry.'
                    type: string
                    example: 'CHILD'
            modifiable:
              description: 'Indicates whether the case can be modified.'
              type: boolean
              example: false
            reOpen:
              description: 'Indicates whether the case can be reopened.'
              type: boolean
              example: false
            cancellable:
              description: 'Indicates whether the case can be cancelled.'
              type: boolean
              example: true
            respond:
              description: 'Indicates whether a response can be added to the case.'
              type: boolean
              example: true
    ModifyCase:

  '/support/v2/tickets':
    post:
      tags:
        - Case
      operationId: submitCase
      summary: Create case
      description: |
        Creates a new case using the specified ticket code and request details.
        To ensure a valid request, first use GET /support/v2/tickets/codes to identify the
        appropriate ticket code, then use GET /support/v2/tickets/codes/{code}/schema
        to retrieve the fields, required values, data types, and validation rules applicable to
        that ticket code.

        Build the request payload based on the returned request payload schema and submit it using
        this operation. The request schema is ticket code specific and should be treated as the
        source of truth for the payload structure.
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Case'
            examples:
              MinimalRequiredFields:
                summary: Minimal request with only the required fields
                value:
                  code: '0007-0001'
                  description: 'Enter description of the issue here.'
              WithAttachmentsAndContacts:
                summary: Request with attachments and multiple contact types
                value:
                  code: '0007-0001'
                  customerReferenceId: '111111111'
                  description: 'Enter description of the issue here.'
                  primaryId: '36_0208802724'
                  attachments:
                    - id: '50d76239-d874-4aa3-8cc3-18e394de5e91'
                      name: 'MicrosoftTeams-image.png'
                  contacts:
                    - registeredUsers:
                        - john_doe
                        - jane_smith
                      type: TECHNICAL
                    - registeredUsers:
                        - john_doe
                      type: NOTIFICATION
              WithNestedDetails:
                summary: Request with code-specific nested details
                value:
                  code: '0007-0001'
                  customerReferenceId: 'CustomerReference001'
                  description: 'Enter description of the issue here.'
                  primaryId: 'c4d53b61-d408-41aa-a93f-24cb0bb311d9'
                  occurredDateTime: '2023-08-29T04:01:43.000Z'
                  contacts:
                    - type: TECHNICAL
                      registeredUsers:
                        - technical_contact
                  attachments:
                    - id: c77c5f58-a7ea-4e88-9fc4-1a2900027425
                      name: error-log.txt
                  details:
                    severity: P1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
              examples:
                CaseCreated:
                  summary: Case created
                  value:
                    id: '11150929'
                    type: CASE
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/support/v2/tickets/{id}':
    get:
      tags:
        - Case
      operationId: getCaseDetailsById
      summary: Get Case Details
      description: |
        Retrieves detailed information for a case using its case or order number.
        The response includes the current status, contacts, notes, attachments, related products and other case-specific details.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          description: 'Case or Order Number.'
          required: true
          schema:
            $ref: '#/components/schemas/CaseOrOrderNumber'
          examples:
            CaseNumber:
              summary: Case number
              value: '11150929'
            OrderNumber:
              summary: Order number
              value: '1-204976070710'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleCaseResponseV2'
              examples:
                CaseDetails:
                  summary: Case details
                  value:
                    id: '11150929'
                    accountNumber: '182389736'
                    accountName: 'VjT Existing Reseller New BA'
                    customerReferenceId: 'CustomerReference001'
                    channel: PORTAL
                    orderId: '1-204976070710'
                    location:
                      ibx:
                        - SV5
                    status: IN_PROGRESS
                    contacts:
                      - firstName: John
                        lastName: Doe
                        type: TECHNICAL
                        details:

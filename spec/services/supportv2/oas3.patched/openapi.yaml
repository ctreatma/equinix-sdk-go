openapi: 3.0.0
servers:
  - description: Equinix API
    url: https://api.equinix.com
info:
  version: 2.0.0
  title: Case Management API
  description: 'The API for the Case Management Service.'
  termsOfService: 'https://www.equinix.com/about/legal/terms'
  contact:
    name: Equinix API Support
    url: https://docs.equinix.com/api-support.htm
tags:
  - name: Case
    description: |
      APIs for managing customer cases throughout their lifecycle.<br>
      <b><u>Note:</u></b> Colocation and IBX-related tickets previously known as trouble tickets; now use the case terminology.

      The Case APIs support discovering valid ticket codes, retrieving the request payload
      requirements for a specific ticket code, creating a case, retrieving
      case details, adding notes, and cancelling a case.

      To create a case, follow this workflow:
      1. Call GET /support/v2/tickets/codes to retrieve the ticket codes available
         to the authenticated user. Use the categories query parameter to optionally
         filter the results by product category. The results are paginated; use the
         limit and offset query parameters, or the next link in the pagination object,
         to retrieve all pages.
      2. Select the appropriate ticket code based on the type of issue or support request.
      3. Call GET /support/v2/tickets/codes/{code}/schema using the selected
         ticket code to retrieve the required fields, data types, validation rules,
         applicable constraints, and a sample request payload.
      4. Build the request payload using the returned schema. The request payload schema
         returned for the selected ticket code is the source of truth for the fields and
         validation requirements applicable to that support ticket type.
      5. Call POST /support/v2/tickets with the constructed payload to create the case.
      6. Use the returned case or order number to retrieve the case details, add notes,
         or cancel the case as required.
    externalDocs:
      url: https://docs.equinix.com/customer-support
security:
  - BearerAuth: []
paths:
  '/support/v2/tickets/codes':
    get:
      tags:
        - Case
      operationId: listTicketCodes
      summary: Get Ticket Codes
      description: |
        Retrieves the ticket codes available to the authenticated user, including their classification, description, lifecycle status, and deprecation information.
        Use the `categories` parameter to optionally filter codes by product category.

        The response is paginated. Use the `limit` and `offset` query parameters to page through the results, or follow the `next` and `previous` links returned in the `pagination` object.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          required: false
          description: 'Maximum number of ticket codes to return per page.'
          schema:
            type: integer
            minimum: 1
            example: 10
        - name: offset
          in: query
          required: false
          description: 'Zero-based index of the first ticket code to return.'
          schema:
            type: integer
            minimum: 0
            example: 0
        - name: categories
          in: query
          required: false
          description: >
            Filter results to the specified product categories.
            Accepts a comma-separated list (e.g. `?categories=FABRIC,NETWORK_EDGE`).
            Omit to return all categories permitted for the caller.
          schema:
            type: array
            items:
              type: string
              enum:
                - IBX_DATA_CENTERS
                - CROSS_CONNECT
                - METRO_CONNECT
                - SMART_VIEW
                - EQUINIX_CONNECT
                - FABRIC
                - EQUINIX_INTERNET_ACCESS
                - INTERNET_EXCHANGE
                - NETWORK_EDGE
                - NETWORK_PRODUCT_ACQUIRED
                - PRECISION_TIME
                - TECHNICAL_ENABLEMENT
                - ACCOUNT_SUPPORT
                - API_SUPPORT
                - BILLING_SUPPORT
                - CUSTOMER_QUESTIONNAIRE_SUPPORT
                - ORDER_SUPPORT
                - PORTAL_SUPPORT
                - SERVICE_ACTIVATION
                - OTHERS
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketCodeList'
              examples:
                ActiveCode:
                  summary: Active ticket code (middle page)
                  value:
                    data:
                      - code: '0005-0000'
                        classification: 'COLOCATION_IBX_DATA_CENTERS-SECURITY-THERE_IS_A_SECURITY_ISSUE_WITH_MY_CAGE_OR_CABINET'
                        description: 'Report a physical security issue with a colocation cage or cabinet, such as unauthorized access or a potential breach.'
                        status: 'active'
                        deprecation: null
                    pagination:
                      total: 150
                      offset: 10
                      limit: 10
                      next: '/support/v2/tickets/codes?limit=10&offset=20'
                      previous: '/support/v2/tickets/codes?limit=10&offset=0'
                DeprecatedWithSuccessor:
                  summary: Deprecated ticket code with a replacement (first page)
                  value:
                    data:
                      - code: '0301-0000'
                        classification: 'COLOCATION_IBX_DATA_CENTERS-IBX_SUPPORT-IBX_FACILITY_INQUIRY'
                        description: 'Submit a general inquiry or support request related to the physical Equinix IBX data center facility and operations.'
                        status: 'deprecated'
                        deprecation:
                          sunsetAt: '2027-04-07T00:00:00Z'
                          successor: '0102-0700'
                    pagination:
                      total: 150
                      offset: 0
                      limit: 10
                      next: '/support/v2/tickets/codes?limit=10&offset=10'
                DeprecatedWithoutSuccessor:
                  summary: Deprecated ticket code with no replacement (last page)
                  value:
                    data:
                      - code: '0301-0000'
                        classification: 'COLOCATION_IBX_DATA_CENTERS-IBX_SUPPORT-IBX_FACILITY_INQUIRY'
                        description: 'Submit a general inquiry or support request related to the physical Equinix IBX data center facility and operations.'
                        status: 'deprecated'
                        deprecation:
                          sunsetAt: '2027-01-01T00:00:00Z'
                          successor: null
                    pagination:
                      total: 150
                      offset: 140
                      limit: 10
                      previous: '/support/v2/tickets/codes?limit=10&offset=130'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  '/support/v2/tickets/codes/{code}/schema':
    get:
      tags:
        - Case
      operationId: getTicketCodeRequestSchema
      summary: Get Request Schema And Example By Ticket Code
      description: |
        Retrieves the request payload schema and a sample request for the specified ticket code. The response defines the fields, required values, data types, and validation constraints applicable to creating a case with the selected ticket code.

        The available fields, required fields, validation rules, and example values may vary depending on the ticket code. The sample request is illustrative and intended as a reference; it may differ for other ticket codes.
      security:
        - BearerAuth: []
      parameters:
        - name: code
          in: path
          description: 'The ticket code to retrieve the request payload schema and sample request payload. See GET /support/v2/tickets/codes for the list of available ticket codes.'
          required: true
          schema:
            type: string
            description: 'Ticket code, e.g. "0000-0000".'
            example: '0000-0000'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestSchemaResponse'
              example:
                code: '0000-0000'
                schema:
                  code:
                    dataType: string
                    fieldDescription: Provide the ticket code for creating a case. Refer to the Ticket Codes API (/support/v2/tickets/codes) for a list of available ticket codes.
                    required: true
                  description:
                    dataType: string
                    fieldDescription: Description of the issue.
                    required: true
                    minLength: 1
                    maxLength: 4000
                  attachments:
                    dataType: array
                    fieldDescription: 'Attachments must be uploaded using the Attachment API (/v1/attachments/file) before they can be referenced in this request. Each upload request supports one file and the maximum file size is 10 MB per file. Supported formats are PDF, PNG, JPG/JPEG, GIF, BMP, TIF/TIFF, TXT, CSV, DOC/DOCX, XLS/XLSX, PPT/PPTX, PPS/PPSX, and VSD/VSDX. Do not set the purpose query parameter on the upload request; it is not used for support cases. After a successful upload, use the returned values in the attachments array: attachmentId maps to id and attachmentName maps to name. The actual file content or multipart data should not be included in this payload.'
                    required: false
                    constraints:
                      maxItems: 5
                    items:
                      dataType: object
                      fields:
                        id:
                          dataType: string
                          required: true
                          format: uuid
                          fieldDescription: The unique identifier returned as attachmentId by the Attachment API after the file has been successfully uploaded.
                        name:
                          dataType: string
                          required: true
                          fieldDescription: 'The original file name returned as attachmentName by the Attachment API, including the file extension.'
                  customerReferenceId:
                    dataType: string
                    fieldDescription: 'Enter an internal reference for the request, such as a Purchase Order number or internal code, which can be used to search and track the request in the portal.'
                    required: false
                    maxLength: 40
                  primaryId:
                    dataType: string
                    fieldDescription: 'Provide the asset number of the affected asset, or the cage/cabinet.'
                    required: true
                  occurredDateTime:
                    dataType: string
                    fieldDescription: Provide the date and time when the incident occurred or was first noticed.
                    format: date-time
                    required: true
                  callMeFromCage:
                    dataType: boolean
                    fieldDescription: Provide true if you would like the technician to call you from the cage.
                    required: false
                  details:
                    dataType: object
                    fieldDescription: Additional details related to the incident.
                    required: false
                    fields:
                      submarineEngineerRequired:
                        dataType: boolean
                        fieldDescription: Provide true if a submarine engineer is required to investigate the issue. Applicable only to Monet assets.
                        required: false
                  contacts:
                    dataType: array
                    fieldDescription: 'List of contacts associated with the request. Registered or unregistered contacts can be provided together. For registered contacts, provide registeredUsers. For unregistered contacts, provide firstName and details. If provided, at least one contact must be included.'
                    required: false
                    constraints:
                      maxItemsBy:
                        - field: type
                          value: NOTIFICATION
                          maxItems: 13
                        - field: type
                          value: TECHNICAL
                          maxItems: 1
                    items:
                      dataType: object
                      constraints:
                        oneOf:
                          - required:
                              - registeredUsers
                          - required:
                              - firstName
                              - details
                      fields:
                        type:
                          dataType: string
                          required: true
                          fieldDescription: Specifies the role of the contact for the request.
                          allowedValues:
                            - TECHNICAL
                            - NOTIFICATION
                        registeredUsers:
                          dataType: array
                          required: false
                          fieldDescription: Use this field for an existing registered user. Provide the username of the registered user. The username may or may not be an email address.
                          items:
                            dataType: string
                        firstName:
                          dataType: string
                          required: true
                          fieldDescription: First name of the unregistered contact. Applicable only if you provide unregistered user.
                        lastName:
                          dataType: string
                          required: false
                          fieldDescription: Last name of the unregistered contact. Applicable only if you provide unregistered user.
                        details:
                          dataType: array
                          required: true
                          fieldDescription: Contact information for the unregistered contact. Applicable only if you provide unregistered user. An email address is mandatory. Work phone and secondary/mobile phone information are optional.
                          constraints:
                            minItems: 1
                            contains:
                              type: EMAIL
                          items:
                            dataType: object
                            fields:
                              type:
                                dataType: string
                                required: true
                                fieldDescription: Specifies the type of contact detail.
                                allowedValues:
                                  - EMAIL
                                  - PHONE
                                  - MOBILE
                              value:
                                dataType: string
                                required: true
                                fieldDescription: 'Value of the contact detail. For EMAIL, provide a valid email address. For PHONE and MOBILE, provide the phone number together with the country code.'
                              workPhonePrefToCall:
                                dataType: string
                                required: false
                                fieldDescription: Preferred time to contact the unregistered user on their work phone. This field is applicable only when a PHONE detail is provided.
                                allowedValues:
